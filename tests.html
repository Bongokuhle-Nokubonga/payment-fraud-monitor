<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Fraud Monitor Tests</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page { padding: 40px 0; }
    ul { list-style: none; padding: 0; margin: 0; font: .9rem ui-monospace, Consolas, monospace; }
    li { padding: 6px 0; border-bottom: 1px solid var(--border); }
    li.pass { color: var(--accent); }
    li.fail { color: var(--high); }
  </style>
</head>
<body>
  <main class="wrap page">
    <h1>Tests</h1>
    <p id="summary"><strong>Running…</strong></p>
    <div class="card"><ul id="list"></ul></div>
    <p><a href="./">← Back to the dashboard</a></p>
  </main>
  <script type="module">
    import { cases } from "./tests/cases.js";
    const list = document.getElementById("list");
    let failed = 0;
    for (const [name, fn] of cases) {
      const li = document.createElement("li");
      try { fn(); li.textContent = "PASS  " + name; li.className = "pass"; }
      catch (e) { failed++; li.textContent = "FAIL  " + name + " -> " + e.message; li.className = "fail"; }
      list.appendChild(li);
    }
    document.getElementById("summary").textContent = `${cases.length - failed} passed, ${failed} failed`;
  </script>
</body>
</html>
